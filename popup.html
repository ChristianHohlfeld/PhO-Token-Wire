<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhO Token Wire</title>
<style>
body{margin:0;width:320px;background:#11161d;color:#eef3f8;font:13px/1.4 system-ui,sans-serif}main{padding:14px}h1{font-size:15px;margin:0 0 12px}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}select,input[type=number]{background:#1c2430;color:inherit;border:1px solid #344052;border-radius:7px;padding:5px 7px}input[type=checkbox]{width:16px;height:16px}.note{font-size:11px;opacity:.65;margin-top:12px;border-top:1px solid #2b3441;padding-top:10px}.ok{font-size:11px;min-height:16px;opacity:.8}</style>
</head>
<body><main>
<h1>PhO Token Wire</h1>
<label><span>Aktiv</span><input id="enabled" type="checkbox"></label>
<label><span>Input adaptiv kürzen</span><input id="compressInput" type="checkbox"></label>
<label><span>Antwort knapp halten</span><input id="wireMode" type="checkbox"></label>
<label><span>Kompression</span><select id="level"><option value="safe">safe</option><option value="aggressive">aggressiv/adaptiv</option></select></label>
<label><span>Antwortlimit Wörter</span><input id="maxWords" type="number" min="20" max="1000" step="10"></label>
<label><span>Nur wenn Sende-Prompt spart</span><input id="onlyIfInputSaves" type="checkbox"></label>
<input id="autoDecode" type="checkbox" hidden>
<div class="ok" id="status"></div>
<div class="note">Es werden mehrere Prompt-Varianten mit o200k_base gemessen; nur die billigste Input-Variante wird verwendet. Der Antwort-Hinweis ist bewusst minimal und sein Break-even wird im Chat angezeigt.</div>
</main><script src="popup.js"></script></body>
</html>
