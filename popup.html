<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoLine</title>
<style>
body{margin:0;width:320px;background:#11161d;color:#eef3f8;font:13px/1.4 system-ui,sans-serif}main{padding:14px}h1{font-size:15px;margin:0 0 12px}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}select{background:#1c2430;color:inherit;border:1px solid #344052;border-radius:7px;padding:5px 7px}input[type=checkbox]{width:16px;height:16px}.note{font-size:11px;opacity:.68;margin-top:12px;border-top:1px solid #2b3441;padding-top:10px}.ok{font-size:11px;min-height:16px;opacity:.8}</style>
</head>
<body><main>
<h1>PhoLine · PhO Token Wire</h1>
<label><span>Aktiv</span><input id="enabled" type="checkbox"></label>
<label><span>Sprache</span><select id="language"><option value="auto">Auto DE/EN</option><option value="de">Deutsch</option><option value="en">English</option></select></label>
<label><span>¶-Antwortkanal anfordern</span><input id="replyChannel" type="checkbox"></label>
<label><span>¶-Antworten lokal expandieren</span><input id="decodeReplies" type="checkbox"></label>
<div class="ok" id="status"></div>
<div class="note">PhoLine verändert das sichtbare Textfeld nicht. Nur wenn der gemessene PhO-Kanal in o200k wirklich weniger Tokens braucht, ersetzt der MAIN-world Hook die Nutzlast in fetch/XHR/WebSocket unmittelbar vor dem Netzaufruf.</div>
</main><script src="popup.js"></script></body>
</html>
